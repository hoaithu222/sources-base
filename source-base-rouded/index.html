<!doctype html>
<!-- Nền mặc định SÁNG (base light); bootstrap áp theme và TV đã lưu trước khi render React. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` — BẮT BUỘC cho máy tính bảng ở chế độ PWA. Không có
      nó, WebKit tự chừa dải lề đen quanh vùng an toàn và biến
      `env(safe-area-inset-*)` thành 0 → không thể canh thanh neo đáy tránh vạch
      Home. Trên máy để bàn thuộc tính này KHÔNG có tác dụng gì.

      `maximum-scale` / `user-scalable` CỐ Ý KHÔNG khai: khoá phóng to là chặn
      luôn khả năng phóng của người cần trợ năng, và app dạng bảng số liệu dày
      thì phóng hai ngón là thao tác chính đáng.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Base App" />

    <!-- PWA: manifest cho trình duyệt chuẩn; cụm apple-* cho iPadOS < 16.4.
         `status-bar-style=default` = thanh trạng thái ĐỤC, nội dung bắt đầu
         ngay dưới nó. KHÔNG dùng `black-translucent` — kiểu đó cho nội dung
         chui xuống dưới thanh trạng thái, header mất một dải 20px.
         Hai `theme-color` = token `bg-page` của colors-theme.json (sáng `#F1F5F4` · tối xanh đêm `#070B10`) — test
         `tests/app/index-html.test.ts` giữ khớp; lúc chạy `applyAppearance` ghi lại theo theme đang hiển thị. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F1F5F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070B10" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Base App" />
    <!-- iOS tự biến số điện thoại trong text thành link xanh, phá màu chữ ô mã/số -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ⛔ Inter PHẢI xin CẢ trục `opsz`, đừng rút về `wght` một mình.
         `base/document.css` khai `font-optical-sizing: auto` ("variable font tự
         chỉnh nét theo cỡ chữ") — nhưng URL chỉ có `wght@100..900` thì file nhận
         về KHÔNG có trục opsz, dòng khai kia là NO-OP im lặng: Inter bị ghim ở
         bản Text (opsz = 14) kể cả khi vẽ chữ 40px.
         Có `opsz` → heading 20–40px lấy được bản Display (khe chữ chặt, nét đanh
         hơn). Chữ ≤ 14px KHÔNG đổi vì opsz mặc định vốn đã là 14. Đổi lại là
         ~+24 kB mỗi subset. Kiểm: Google trả HTTP 400 cho trục bịa, nên 200
         nghĩa là trục này có thật. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Base App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
